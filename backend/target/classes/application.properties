server.port=8080

# Nombre de la aplicacion (aparece en logs)
spring.application.name=proxy-monitor

# Nivel de log: INFO en prod, DEBUG en dev para ver mas detalle
logging.level.com.proxy.monitor=DEBUG
logging.level.org.springframework.web=INFO

# URL del frontend para CORS (se sobreescribe en Render con variable de entorno)
frontend.url=${FRONTEND_URL:http://localhost:5173}
